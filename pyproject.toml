[project]
name = "thesdel"
version = "0.1.0"
description = "Thesdel backend — FastAPI + MongoDB + Redis"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "motor>=3.6",
    "redis>=5.2",
    "argon2-cffi>=23.1",
    "pyjwt>=2.10",
    "arq>=0.26",
    "python-multipart>=0.0.12",
    "structlog>=24.4",
    "google-auth>=2.35",
    "requests>=2.32",
    # Used by app/auth/jobs.py's Resend HTTP wrapper (runs in the ARQ
    # worker process, not just tests) — already vetted as a dev dependency,
    # promoted here since production job code now needs it too.
    "httpx>=0.27",
    # S3-compatible client for R2 (app/shared/storage.py) — R2's API is
    # S3-compatible, so the AWS SDK works directly against it with a custom
    # endpoint_url; no Cloudflare-specific SDK exists/needed. See
    # docs/DECISIONS.md ADR-014.
    "boto3>=1.34",
    # Server-side image re-encode/validation for timetable-import uploads
    # (app/files/service.py) — decode-then-re-encode strips embedded
    # scripts/metadata and defeats disguised-file-type tricks, per
    # docs/SECURITY.md's file-upload threat row. See ADR-014.
    "pillow>=10.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
    "mongomock-motor>=0.0.34",
    "fakeredis>=2.26",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
